<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1235"/>
      <stop offset="55%" stop-color="#2b1a55"/>
      <stop offset="100%" stop-color="#3a1f6e"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a52"/>
      <stop offset="100%" stop-color="#1c1c2b"/>
    </linearGradient>
    <linearGradient id="leftBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fd8ff"/>
      <stop offset="100%" stop-color="#1fa9e0"/>
    </linearGradient>
    <linearGradient id="rightBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5fb0"/>
      <stop offset="100%" stop-color="#d62f8b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8a5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Ghost side-devices (modularity / multi-mouse support) -->
  <g opacity="0.28">
    <rect x="96" y="196" width="60" height="96" rx="30" fill="none" stroke="#c9b8ff" stroke-width="6"/>
    <rect x="356" y="196" width="60" height="96" rx="30" fill="none" stroke="#c9b8ff" stroke-width="6"/>
  </g>

  <!-- Connector nodes linking modular devices -->
  <g stroke="#c9b8ff" stroke-width="4" opacity="0.45">
    <line x1="156" y1="244" x2="192" y2="244"/>
    <line x1="320" y1="244" x2="356" y2="244"/>
  </g>
  <circle cx="156" cy="244" r="6" fill="#c9b8ff" opacity="0.6"/>
  <circle cx="356" cy="244" r="6" fill="#c9b8ff" opacity="0.6"/>

  <!-- Main mouse body -->
  <g filter="url(#softShadow)">
    <path d="M256 128
             C 308 128 340 168 340 224
             L 340 320
             C 340 372 302 404 256 404
             C 210 404 172 372 172 320
             L 172 224
             C 172 168 204 128 256 128 Z"
          fill="url(#mouseBody)" stroke="#0e0e18" stroke-width="4"/>

    <!-- Left button -->
    <path d="M256 132
             C 226 132 200 150 186 178
             L 250 178
             L 250 132
             Z"
          fill="url(#leftBtn)"/>

    <!-- Right button -->
    <path d="M256 132
             C 286 132 312 150 326 178
             L 262 178
             L 262 132
             Z"
          fill="url(#rightBtn)"/>

    <!-- Divider line between buttons -->
    <line x1="256" y1="130" x2="256" y2="180" stroke="#0e0e18" stroke-width="4"/>
    <!-- Divider arc separating buttons from body -->
    <path d="M186 178 L326 178" stroke="#0e0e18" stroke-width="4" fill="none"/>

    <!-- Scroll wheel -->
    <rect x="244" y="188" width="24" height="40" rx="12" fill="#0e0e18"/>
    <rect x="248" y="196" width="16" height="10" rx="5" fill="#8a5cff"/>

    <!-- Body highlight -->
    <path d="M188 232 C 188 188 216 150 256 148" stroke="#5a5a78" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Small remap arrows near base, hinting at remapping -->
  <g stroke="#c9b8ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M204 356 a 30 30 0 1 1 6 22"/>
    <polygon points="200,346 204,362 216,352" fill="#c9b8ff"/>
    <path d="M308 356 a 30 30 0 1 0 -6 22"/>
    <polygon points="312,346 308,362 296,352" fill="#c9b8ff"/>
  </g>
</svg>
